name: ECB liquidity daily updates
on:
  schedule:
    - cron: '3,13,23,33,43,53 5-22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ecb-liquidity-daily.yml]
permissions:
  contents: write
concurrency:
  group: ecb-liquidity-dataset
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated liquidity branch
        uses: actions/checkout@v4
        with:
          ref: ecb-liquidity-dashboard-20260906
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture previous published observation
        id: before
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('ecb-liquidity/data/liquidity.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          rows=d.get('records') or []
          weekdays=[r for r in rows if r.get('date') and __import__('datetime').date.fromisoformat(r['date']).weekday() < 5]
          if weekdays:
              r=weekdays[-1]
              print(f"date={r.get('date','')}")
              print(f"value={r.get('value','')}")
          else:
              print("date=")
              print("value=")
          PY
      - name: Download and validate official ECB data
        id: collect
        continue-on-error: true
        run: python ecb-liquidity/refresh.py
      - name: Record the active collection schedule
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('liquidity.json', 'status.json'):
              path = Path('ecb-liquidity/data') / name
              if not path.exists():
                  continue
              data = json.loads(path.read_text())
              data['schedule_utc'] = '3,13,23,33,43,53 5-22 * * 1-5'
              data['schedule_note'] = 'Weekdays: 05:03-22:53 UTC every 10 minutes. Scheduled runs may be delayed.'
              path.write_text(json.dumps(data, separators=(',', ':'), allow_nan=False) if name == 'liquidity.json' else json.dumps(data, indent=2, allow_nan=False))
          PY
      - name: Refresh embedded dashboard fallback when source advances
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = Path('ecb-liquidity/index.html')
          dataset = Path('ecb-liquidity/data/liquidity.json')
          if not index.exists() or not dataset.exists():
              raise SystemExit
          html = index.read_text()
          marker = '<script id="embedded-data" type="application/json">'
          start = html.index(marker) + len(marker)
          end = html.index('</script>', start)
          current = json.loads(html[start:end])
          latest = json.loads(dataset.read_text())
          current_date = (current.get('records') or [{}])[-1].get('date', '')
          latest_date = (latest.get('records') or [{}])[-1].get('date', '')
          if latest_date > current_date:
              packed = json.dumps(latest, separators=(',', ':'), allow_nan=False)
              index.write_text(html[:start] + packed + html[end:])
              print(f'Embedded fallback advanced from {current_date} to {latest_date}')
          else:
              print(f'Embedded fallback already current at {current_date}')
          PY
      - name: Persist dataset and visible refresh diagnostics
        if: always()
        run: |
          if [ -f ecb-liquidity/data/liquidity.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ecb-liquidity/data/ ecb-liquidity/index.html
            if ! git diff --cached --quiet; then
              git commit -m "Update official ECB excess liquidity $(date -u +%F)"
              git push origin HEAD:ecb-liquidity-dashboard-20260906
            fi
          fi
      - name: Prepare new-observation alert
        id: alert
        if: always()
        shell: bash
        run: |
          BEFORE_DATE='${{ steps.before.outputs.date }}' python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p=Path('ecb-liquidity/data/liquidity.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          rows=d.get('records') or []
          weekdays=[r for r in rows if r.get('date') and __import__('datetime').date.fromisoformat(r['date']).weekday() < 5]
          old=os.environ.get('BEFORE_DATE','')
          if not weekdays:
              print('new=false')
              raise SystemExit
          latest=weekdays[-1]
          if not old or latest.get('date','') <= old:
              print('new=false')
              raise SystemExit
          prev=weekdays[-2] if len(weekdays)>1 else {}
          value=float(latest.get('value',0))/1000
          prev_value=float(prev.get('value',0))/1000 if prev.get('value') is not None else None
          change=(value-prev_value) if prev_value is not None else None
          print('new=true')
          print(f"date={latest.get('date','')}")
          print(f"value_bn={value:.3f}")
          print(f"prev_date={prev.get('date','')}")
          print(f"prev_value_bn={prev_value:.3f}" if prev_value is not None else 'prev_value_bn=')
          print(f"change_bn={change:+.3f}" if change is not None else 'change_bn=')
          PY
      - name: Send ECB liquidity update to Teams
        if: steps.alert.outputs.new == 'true'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          OBS_DATE: ${{ steps.alert.outputs.date }}
          VALUE_BN: ${{ steps.alert.outputs.value_bn }}
          PREV_DATE: ${{ steps.alert.outputs.prev_date }}
          PREV_VALUE_BN: ${{ steps.alert.outputs.prev_value_bn }}
          CHANGE_BN: ${{ steps.alert.outputs.change_bn }}
        shell: bash
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL is not configured; dashboard update succeeded but Teams webhook delivery is skipped."
            exit 0
          fi
          python - <<'PY' > /tmp/teams-payload.json
          import json, os
          message = (
            '<b>ECB LIQUIDITY UPDATE</b><br><br>'
            '<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;">'
            '<tr><td><b>Observation date</b></td><td>' + os.environ['OBS_DATE'] + '</td></tr>'
            '<tr><td><b>Excess liquidity</b></td><td>EUR ' + os.environ['VALUE_BN'] + 'bn</td></tr>'
            '<tr><td><b>Daily change</b></td><td>' + os.environ['CHANGE_BN'] + 'bn</td></tr>'
            '<tr><td><b>Previous observation</b></td><td>' + os.environ['PREV_DATE'] + ' — EUR ' + os.environ['PREV_VALUE_BN'] + 'bn</td></tr>'
            '<tr><td><b>Source</b></td><td>ECB</td></tr>'
            '</table>'
          )
          payload={
            'title':'ECB LIQUIDITY UPDATE',
            'observation_date':os.environ['OBS_DATE'],
            'excess_liquidity_bn':os.environ['VALUE_BN'],
            'daily_change_bn':os.environ['CHANGE_BN'],
            'previous_observation_date':os.environ['PREV_DATE'],
            'previous_excess_liquidity_bn':os.environ['PREV_VALUE_BN'],
            'source':'ECB',
            'message':message
          }
          print(json.dumps(payload))
          PY
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data-binary @/tmp/teams-payload.json "$TEAMS_WEBHOOK_URL"
      - name: Preserve downloadable snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecb-liquidity-dataset
          path: ecb-liquidity/data/
          retention-days: 14
          if-no-files-found: error
      - name: Report collection failure without hiding cached data
        if: steps.collect.outcome == 'failure'
        run: exit 1
