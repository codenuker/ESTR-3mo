name: Verify ECB analytics dashboard
on:
  push:
    branches: [ecb-liquidity-dashboard-20260906]
    paths: [.github/workflows/ecb-force-api-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public UI and ECB API refresh
        run: |
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from datetime import datetime, timezone
          out=Path('verification'); out.mkdir(exist_ok=True)
          base='https://lois-ecb-liquidity.vercel.app'
          time.sleep(15)
          report={'checked_at':datetime.now(timezone.utc).isoformat(),'base':base}
          def get(route, post=False):
              headers={'User-Agent':'ECB-Dashboard-Verification/5.0'}
              if post: headers.update({'Content-Type':'application/json','Origin':base})
              req=Request(base+route,data=b'{}' if post else None,headers=headers,method='POST' if post else 'GET')
              with urlopen(req,timeout=75) as r: return r.status,r.headers,r.read(6000000)
          status,headers,body=get('/')
          text=body.decode('utf-8')
          report['page']={'status':status,'title':re.findall(r'<title>(.*?)</title>',text),'analysis_tab':'DATA ANALYSIS' in text,'old_method_tab':'data-tab="sources"' in text,'heat_change_default':'<option value="change" selected>Month-end change</option>' in text,'force_button':'id="force-restart"' in text,'forecast_models':all(x in text for x in ['Linear trend','AR(1)','AR(3)','Ridge AR(5)']),'csv_upload':'id="upload-file"' in text}
          (out/'page.html').write_bytes(body)
          status,headers,body=get('/api/liquidity')
          api=json.loads(body); report['api']={'status':status,'latest':api.get('last_date'),'value':api.get('latest_millions'),'success':api.get('refresh',{}).get('success')}
          (out/'api.json').write_bytes(body)
          status,headers,body=get('/api/force-restart',True)
          force=json.loads(body); report['force']={'status':status,'latest':force.get('last_date'),'success':force.get('refresh',{}).get('success'),'cached':force.get('refresh',{}).get('cached')}
          (out/'force.json').write_bytes(body)
          status,headers,body=get('/icon.svg?v=5')
          icon=body.decode('utf-8'); report['icon']={'status':status,'content_type':headers.get('Content-Type'),'valid_svg':icon.lstrip().startswith('<svg') and '</svg>' in icon}
          (out/'icon.svg').write_text(icon)
          (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          p=report['page']
          assert p['status']==200
          assert p['title']==['ECB Excess Liquidity']
          assert p['analysis_tab'] and not p['old_method_tab']
          assert p['heat_change_default'] and p['force_button']
          assert p['forecast_models'] and p['csv_upload']
          assert report['api']['status']==200 and report['api']['success'] is True
          assert report['force']['status']==200 and report['force']['success'] is True and report['force']['cached'] is False
          assert report['icon']['status']==200 and report['icon']['valid_svg'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecb-v5-verification
          path: verification/
          retention-days: 14
