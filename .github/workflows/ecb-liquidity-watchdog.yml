name: ECB liquidity watchdog

on:
  schedule:
    - cron: '7,22,37,52 5-22 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: ecb-liquidity-watchdog
  cancel-in-progress: true

jobs:
  trigger-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger the primary ECB liquidity refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ecb-liquidity-daily.yml/dispatches" \
            -f ref=main \
            -f 'inputs[send_current]=false'
