name: EXLIQ AI check
on:
  push:
    branches: [ecb-liquidity-dashboard-20260906]
    paths: [.github/workflows/exliq-ai-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask EXLIQ AI
        run: |
          response=$(curl -fsS --max-time 120 -X POST https://lois-ecb-liquidity.vercel.app/api/chat -H 'Content-Type: application/json' -d '{"question":"Give the latest excess liquidity date and level."}')
          echo "$response"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("answer"); assert d.get("data_date")' "$response"
