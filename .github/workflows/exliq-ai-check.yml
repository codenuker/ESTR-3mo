name: EXLIQ AI check
on:
  push:
    branches: [ecb-liquidity-dashboard-20260906]
    paths: [.github/workflows/exliq-ai-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask EXLIQ AI
        run: |
          curl -sS --max-time 120 -o /tmp/exliq.json -w 'HTTP_STATUS=%{http_code}\n' -X POST https://lois-ecb-liquidity.vercel.app/api/chat -H 'Content-Type: application/json' -d '{"question":"Give the latest excess liquidity date and level."}'
          cat /tmp/exliq.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/exliq.json'))
          print('ERROR=', data.get('error'))
          PY
