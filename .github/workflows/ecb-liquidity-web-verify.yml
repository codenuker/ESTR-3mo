name: Verify public liquidity dashboard
on:
  push:
    branches: [ecb-liquidity-dashboard-20260906]
    paths: [.github/workflows/ecb-liquidity-web-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify anonymous production access
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from pathlib import Path
          from datetime import datetime, timezone
          import json, re, hashlib, time
          out=Path('web-verification');out.mkdir()
          urls=['https://lois-ecb-liquidity-lixmruyx5-saksham190804s-projects.vercel.app','https://lois-ecb-liquidity-saksham190804s-projects.vercel.app']
          results=[]
          for n,url in enumerate(urls):
              result={'url':url,'checked_at':datetime.now(timezone.utc).isoformat()}
              for attempt in range(4):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'LOIS-Dashboard-Verification/2.0'}),timeout=20) as r:
                          body=r.read(3000000).decode('utf-8');result.update(status=r.status,final_url=r.url)
                      (out/f'page-{n}.html').write_text(body)
                      m=re.search(r'<script id="embedded-data" type="application/json">(.*?)</script>',body,re.S)
                      result.update(bytes=len(body),sha256=hashlib.sha256(body.encode()).hexdigest(),colour_patch='Math.pow(m,.42)' in body,records=len(json.loads(m.group(1))['records']) if m else 0,has_dashboard='MONTHLY LIQUIDITY HEATMAP' in body,title=re.findall(r'<title>(.*?)</title>',body))
                      result['passed']=result['status']==200 and result['colour_patch'] and result['records']>=1400 and result['has_dashboard']
                      break
                  except HTTPError as e:
                      result.update(status=e.code,error=str(e),passed=False)
                      (out/f'error-{n}.html').write_bytes(e.read(200000))
                      if e.code not in (404,503):break
                      time.sleep(5)
                  except Exception as e:
                      result.update(error=str(e),passed=False);time.sleep(5)
              print(json.dumps(result),flush=True);results.append(result)
          (out/'results.json').write_text(json.dumps(results,indent=2))
          if not any(r.get('passed') for r in results):raise SystemExit('Public dashboard verification has not passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidity-dashboard-web-verification
          path: web-verification/
          retention-days: 14
